<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Current-model dashboard</title>
<!--
  Viewer for a `*-current-model.json` (schema: ~/.claude/skills/_shared/current-model-json.md).
  Self-contained, offline, training look (Fraunces + IBM Plex if installed, warm palette, hero, step cards).
  Overview (default, short):
    1. Questions the concept answers — collapsed list (3 + „…”), REJECTED left out, SI bucket on expand.
    2. How questions group — graph decision → question (by code: who consumes the answer), one example
       built from the data (where in code, how conditions are checked, what „no” does); no criteria here.
    3. How decisions group further — graph group → decision → question (by effect: what changes, who
       notices), majority groups only, each decision with its role; one example from the data; no counts.
    4. Biggest pains — `pains_method` in one sentence, one short line per pain: means or goal, „po co”,
       the top questions (groups) it hurts with the number of reports; 🔥 on those groups in graph 3.
    5. Island files (#pliki-wyspy) — every `artifacts[].file`, collapsed code box (4 + „…”), copy button.
  „Szczegóły” (button): verdict, system entries found in Phase 1 (`entries`), pains in full, all generalization passes with counts, full tree with
  criteria/operators/negative effects, input, all questions with critic verdicts, artifact diagram.
  Load JSON via embedded data, drag&drop, or the Load button.
-->
<script type="application/json" id="embedded-data">null</script>
<style>

    --ent:#dbe7ff; --ent-br:#6f9bf0; --tbl:#e8e0f7; --tbl-br:#9d7fd0; --svc:#e3f3ea; --svc-br:#5cb98a; --help:#fdeede; --help-br:#e0a95c;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#15110e; --panel:#1f1812; --ink:#f1e9dd; --muted:#ab9d8c; --line:#352b22;
    --chip:#241c15; --chip-ink:#d8ccbc; --accent:#e08a4c; --accent-soft:#3a2617; --flash:#3a3410;
    --green:#5bd08a; --green-bg:#12301f; --amber:#e6b23a; --amber-bg:#332807;
    --red:#f0857a; --red-bg:#361613; --purple:#c19dee; --purple-bg:#241733; --slate:#9aa7b8; --slate-bg:#1d222b;

    --ent:#22314e; --ent-br:#4f78c8; --tbl:#2c2340; --tbl-br:#8a6fc0; --svc:#123020; --svc-br:#3f8f66; --help:#33280a; --help-br:#9c7a2e;
  }}
  :root[data-theme="light"]{color-scheme:light;--bg:#f4efe6;--panel:#fbf8f2;--ink:#201a16;--muted:#6b5f54;--line:#d8cdbb;--chip:#efe7da;--chip-ink:#4a3f36;--accent:#b5632b;--accent-soft:#f3e3d4;--flash:#fff3bf;--green:#1a7f4b;--green-bg:#e4f4ea;--amber:#9a6700;--amber-bg:#fbf1d6;--red:#b42318;--red-bg:#fbe4e2;--purple:#6b3fa0;--purple-bg:#efe6fb;--slate:#475467;--slate-bg:#eceff3;--code-bg:#efe7da;--code-ink:#2b2420;--ent:#dbe7ff;--ent-br:#6f9bf0;--tbl:#e8e0f7;--tbl-br:#9d7fd0;--svc:#e3f3ea;--svc-br:#5cb98a;--help:#fdeede;--help-br:#e0a95c;}
  :root[data-theme="dark"]{color-scheme:dark;--bg:#15110e;--panel:#1f1812;--ink:#f1e9dd;--muted:#ab9d8c;--line:#352b22;--chip:#241c15;--chip-ink:#d8ccbc;--accent:#e08a4c;--accent-soft:#3a2617;--flash:#3a3410;--green:#5bd08a;--green-bg:#12301f;--amber:#e6b23a;--amber-bg:#332807;--red:#f0857a;--red-bg:#361613;--purple:#c19dee;--purple-bg:#241733;--slate:#9aa7b8;--slate-bg:#1d222b;--code-bg:#120e0b;--code-ink:#e9dfd1;--ent:#22314e;--ent-br:#4f78c8;--tbl:#2c2340;--tbl-br:#8a6fc0;--svc:#123020;--svc-br:#3f8f66;--help:#33280a;--help-br:#9c7a2e;}

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.65 "IBM Plex Sans","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    background-image:linear-gradient(180deg,transparent 40%,color-mix(in oklab,#1f7a73 6%,transparent))}
  /* wygląd strony szkolenia: hero, kroki-karty, Fraunces + IBM Plex (lokalnie, bez sieci) */
  .hero{position:relative;overflow:hidden;margin:-20px -20px 26px;padding:28px 24px 30px;border-bottom:1px solid var(--line);
    background:radial-gradient(120% 80% at 85% -10%,color-mix(in oklab,var(--accent) 22%,transparent),transparent 60%),
      radial-gradient(90% 70% at -10% 110%,color-mix(in oklab,#1f7a73 20%,transparent),transparent 55%),linear-gradient(160deg,var(--bg),var(--panel))}
  .hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.45;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;
    -webkit-mask-image:radial-gradient(70% 70% at 60% 20%,#000,transparent);mask-image:radial-gradient(70% 70% at 60% 20%,#000,transparent)}
  .hero>*{position:relative}
  .hero .pasek{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .eyebrow{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin:0}
  .hero h1{font-size:clamp(1.7rem,4.2vw,2.6rem);line-height:1.15;margin:14px 0 0}
  .intro{color:var(--muted);font-size:1.05rem;max-width:68ch;margin:10px 0 0}
  .krok{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:16px 0;
    box-shadow:0 1px 2px rgba(60,40,20,.05),0 10px 30px -12px rgba(60,40,20,.18)}
  .krok-h{display:flex;gap:14px;align-items:flex-start;margin:30px 0 10px}
  .krok-h .nr{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;
    font:600 1rem/1 "Fraunces",Georgia,serif}
  .krok-h h2{margin:2px 0 0;font-size:1.45rem} .krok-h p{margin:2px 0 0}
  .bol{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline}
  .bol .rk{font:600 1.9rem/1 "Fraunces",Georgia,serif;color:var(--accent);grid-row:span 2}
  .bol h3{margin:0;font-size:1.2rem} .bol p{margin:0}
  .pyt{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
  .pyt li{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--bg)}
  .pyt li b{font-family:"Fraunces",Georgia,serif;font-weight:560;font-size:1.06rem}
  .pyt .po{display:block;color:var(--muted);font-size:.92rem;margin-top:2px}
  .si{border-left:4px solid var(--amber);background:var(--amber-bg);border-radius:0 12px 12px 0;padding:8px 14px;margin:10px 0}
  .ok{border-left:4px solid var(--green);background:var(--green-bg);border-radius:0 12px 12px 0;padding:8px 14px;margin:10px 0}
  .si .lab,.ok .lab,.krok .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:650;margin:10px 0 4px}
  .si .lab:first-child,.ok .lab:first-child{margin-top:2px}
  #sz{border-top:1px dashed var(--line);margin-top:34px}
  .zwin .kropki{display:none;color:var(--muted);padding-left:26px;font-size:1.2rem;line-height:1}
  .zwin.zwiniety ol.lista li:nth-child(n+4){display:none} .zwin.zwiniety .kropki{display:block} .zwin.zwiniety .reszta{display:none}
  .przel{margin-top:10px}
  table.wejscia{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  table.wejscia th,table.wejscia td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  table.wejscia th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .bol-lista{gap:12px} .bol-lista .po{margin-top:2px}
  .przyklad{border-left:4px solid var(--accent);background:var(--panel);border-radius:0 12px 12px 0;padding:8px 16px;margin:8px 0 12px}
  .przyklad p{margin:4px 0} .przyklad ol,.przyklad ul{margin:4px 0;padding-left:22px} .przyklad li{margin:3px 0}
  .przyklad .po{display:block;color:var(--muted);font-size:.88rem;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
  .przyklad .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:650}
  .qt .n.grupa rect{fill:var(--purple-bg);stroke:var(--purple)}
  .lista{margin:0;padding-left:26px;display:grid;gap:5px} ol.lista li::marker{color:var(--accent);font-weight:600}
  .lista .po{display:block;color:var(--muted);font-size:.9rem}
  .lista li{border-radius:6px;padding:1px 6px;scroll-margin-top:80px} .lista li.flash{animation:blysk 1.8s ease-out}
  @keyframes blysk{0%,35%{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}100%{background:transparent;box-shadow:none}}
  .ok-tag{display:inline-block;margin-left:8px;font-size:11px;font-weight:600;color:var(--green);background:var(--green-bg);border-radius:999px;padding:0 8px}
  .tag.si-tag,.si-tag{display:inline-block;margin-left:8px;font-size:11px;font-weight:600;color:var(--amber);background:var(--amber-bg);border-radius:999px;padding:0 8px}
  code,.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:.86em}
  .wrap{max-width:980px;margin:0 auto;padding:20px 20px 80px}
  header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:10px}
  header.top h1{font-size:20px;margin:0;font-weight:650}
  header.top .seed{color:var(--accent)}
  .spacer{flex:1}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:6px 0 18px}
  .tab{padding:8px 14px;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:600;margin-bottom:-1px}
  .tab[aria-selected="true"]{color:var(--ink);background:var(--panel);border-color:var(--line);border-bottom:1px solid var(--panel)}

  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:2px 9px;font-size:12px;border:1px solid transparent}
  .chip.link,.ref{cursor:pointer}
  .chip.link:hover{border-color:var(--accent);background:var(--accent-soft)}
  .ref{color:var(--accent);font-weight:600;border-bottom:1px dotted var(--accent)}
  .badge{display:inline-block;border-radius:6px;padding:1px 8px;font-size:11.5px;font-weight:600}
  .b-green{background:var(--green-bg);color:var(--green)} .b-amber{background:var(--amber-bg);color:var(--amber)}
  .b-red{background:var(--red-bg);color:var(--red)} .b-purple{background:var(--purple-bg);color:var(--purple)} .b-slate{background:var(--slate-bg);color:var(--slate)}

  .card{border:1px solid var(--line);border-radius:11px;padding:12px 13px;background:var(--panel);scroll-margin-top:16px;transition:box-shadow .15s,border-color .15s,background .4s}
  .card.flash{background:var(--flash)} .card.dim{opacity:.3} .card.hot{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .card.rejected{border-style:dashed} .card.rejected .q{text-decoration:line-through;opacity:.75}
  .cid{font-weight:700;color:var(--accent);margin-right:7px} .q{font-weight:560}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:5px 0}
  .k{color:var(--muted);font-size:12px;min-width:82px;flex-shrink:0} .v{flex:1;min-width:0}
  .path,.note{color:var(--muted);font-size:12.5px}
  .ev{display:flex;flex-wrap:wrap;gap:6px} .ev code{background:var(--chip);border-radius:5px;padding:1px 6px;color:var(--chip-ink)}
  .evm{display:inline-flex;align-items:center;gap:5px} .evmeth{font-weight:600;font-size:12px}
  .rephrase{border-left:3px solid var(--green);padding:4px 9px;margin:6px 0;background:var(--green-bg);border-radius:0 6px 6px 0}
  .rephrase .lab,.exlab{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .card>.lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650;margin:12px 0 4px}
  .legenda .row{margin:3px 0}.legenda .note{font-size:12.5px}
  .concept-verdict{margin:2px 0 10px;font-size:13px}
  .hostbox{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px;margin:6px 0}.hostbox .hk{color:var(--muted)}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:8px}.split .half{border:1px dashed var(--line);border-radius:8px;padding:7px 9px}.split .half .lab{font-size:11px;text-transform:uppercase;color:var(--muted)}
  @media(max-width:560px){.split{grid-template-columns:1fr}}
  .section-h{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px;font-weight:650}
  .count{color:var(--muted);font-weight:400;margin-left:6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}

  /* overview */
  .concept{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:8px}
  .concept h2{margin:0 0 4px;font-size:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .concept p{margin:4px 0 0;color:var(--muted)}
  .mapwrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;margin:10px 0}
  .maphint{font-size:12px;color:var(--muted);padding:2px 6px}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);padding:4px 6px 8px}
  .legend span{display:inline-flex;align-items:center;gap:4px}
  svg.map{width:100%;height:auto;display:block}
  .qitem{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:7px 0;overflow:hidden;scroll-margin-top:16px;transition:background .4s,opacity .15s,border-color .15s}
  .qitem.flash{background:var(--flash)} .qitem.dim{opacity:.28} .qitem.hot{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .qhead{padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
  .qhead:hover{background:var(--accent-soft)}
  .qhead .disc{color:var(--muted);transition:transform .15s} .qitem.open .qhead .disc{transform:rotate(90deg)}
  .qbody{padding:0 12px 12px 12px;display:none} .qitem.open .qbody{display:block}
  .excerpt{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;margin:6px 0;overflow:hidden}
  .excerpt .exhd{font-size:11.5px;color:var(--muted);padding:4px 8px;border-bottom:1px solid var(--line);background:var(--panel)}
  .excerpt pre{margin:0;padding:8px 10px;overflow-x:auto;color:var(--code-ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.45}
  .inlineref{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13px}
  .inlineref .rt{font-weight:600;color:var(--accent);margin-right:6px}

  .qt-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);max-height:72vh}
  .qt text{font-size:11.5px;fill:var(--ink)} .qt .meta{fill:var(--muted);font-size:10px}
  .qt .n{cursor:pointer} .qt .n rect{stroke-width:1.4}
  .qt .n.decyzja rect{fill:var(--accent-soft);stroke:var(--accent)} .qt .n.pytanie rect{fill:var(--green-bg);stroke:var(--green)}
  .qt .n.kryterium rect{fill:var(--panel);stroke:var(--line)} .qt .n.dup rect{stroke:var(--amber);stroke-dasharray:4 2;stroke-width:2}
  .qt .n.sel rect{stroke:var(--accent);stroke-width:3}
  .qt path{fill:none;stroke:var(--line);stroke-width:1.3} .qt .op{font-size:9.5px;fill:var(--accent);font-weight:600} .qt .eff{font-size:9.5px;fill:var(--red);font-weight:600}
  .qt-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
  .qt-bar select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 8px;max-width:100%}
  .pliki{position:relative;background:var(--code-bg);border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
  .pliki .pasek-k{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--muted)}
  .pliki pre{margin:0;padding:10px 14px;overflow-x:auto;color:var(--code-ink);font:12.5px/1.6 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;white-space:pre}
  .pliki .kropki{display:block;padding:0 14px 8px;color:var(--muted);font:600 1.1rem/1 "IBM Plex Mono",ui-monospace,monospace}
  .empty{border:2px dashed var(--line);border-radius:14px;padding:60px 20px;text-align:center;color:var(--muted)}
  .empty h2{color:var(--ink)} body.drag .empty{border-color:var(--accent);background:var(--accent-soft)}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="pasek">
      <p class="eyebrow">Concept explorer · mapa świadomości</p>
      <span class="spacer"></span>
      <select id="islandSel" class="btn" hidden></select>
      <button class="btn" id="szBtn" hidden>🔎 Szczegóły</button>
      <button class="btn" id="themeBtn">◐</button>
      <button class="btn" id="loadBtn">Wczytaj JSON…</button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
    <h1 id="seed"></h1>
    <p class="intro" id="intro"></p>
    <span class="mono note" id="schemaver" style="display:none"></span>
  </header>

  <div id="overview"></div>
  <div id="detailed" hidden></div>
  <section id="sz" hidden>
    <div class="krok-h"><span class="nr">🔎</span><div><h2>Szczegóły</h2><p class="note">Pełny zapis: wejście, wszystkie pytania z oceną krytyka i dowodami, diagram klas i tabel.</p></div></div>
    <div id="sz-ov"></div>
  </section>

  <div class="empty" id="empty">
    <h2>Drop a <code>*-current-model.json</code> here</h2>
    <p>…or use <b>Load JSON…</b>. Two tabs: a high-level <b>Przegląd</b> and the full <b>Szczegółowy</b> record.</p>
  </div>
</div>

<script>
(function(){
  "use strict";
  var SVGNS="http://www.w3.org/2000/svg";
  var $=function(s,r){return (r||document).querySelector(s);};
  var el=function(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;};
  var svg=function(t,a){var e=document.createElementNS(SVGNS,t);if(a)for(var k in a)e.setAttribute(k,a[k]);return e;};
  var esc=function(x){return String(x==null?"":x).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});};

  $("#themeBtn").addEventListener("click",function(){
    var cur=document.documentElement.getAttribute("data-theme");
    var next=cur==="dark"?"light":cur==="light"?"dark":(matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark");
    document.documentElement.setAttribute("data-theme",next);
  });

  var GENESIS={"domain-genuine":"b-green","structure-induced":"b-amber","concept-circular":"b-red","management-of-mechanism":"b-purple"};
  var VERD={"CONFIRMED-DOMAIN":"b-green","MODEL-PHRASED":"b-purple","STRUCTURE-INDUCED":"b-amber","CONCEPT-CIRCULAR":"b-red","REJECTED":"b-red"};
  var EFFECT={"block":"b-red","warn-override":"b-amber","override-with-right":"b-amber","branch":"b-slate","display":"b-slate","record":"b-slate","leaves-system":"b-purple"};
  var ORIGIN={"domain-external":"b-green","industry-practice":"b-green","system-taught":"b-amber","internal-only":"b-red"};
  function termInfo(t){var vs=island().vocabulary||[];if(typeof t==="string")t={term:t};

    var sb=$("#szBtn");sb.hidden=false;sb.onclick=function(){var z=$("#sz");z.hidden=!z.hidden;sb.textContent=z.hidden?"🔎 Szczegóły":"✕ Schowaj szczegóły";if(!z.hidden)z.scrollIntoView({behavior:"smooth"});};
    $("#schemaver").textContent=data.$schema_version||"";
    var isel=$("#islandSel"); isel.innerHTML=""; (data.islands||[]).forEach(function(is,i){var o=document.createElement("option");o.value=i;o.textContent="Wyspa "+(is.id||i)+": "+(is.name||"");isel.appendChild(o);});
    isel.hidden=(data.islands||[]).length<2; CUR=0; isel.value="0";
    isel.onchange=function(){CUR=+isel.value; renderOverview(); renderDetailed();};
    renderOverview(); renderDetailed();
    $("#empty").hidden=true;
    document.title="Concept explorer"+(data.seed?(" · "+data.seed):"");
  }

  // ---------- loading ----------
  function loadText(txt){try{var d=JSON.parse(txt);if(!d||!d.islands)throw new Error("not a current-model JSON (missing 'islands')");render(d);}catch(err){alert("Could not parse JSON: "+err.message);}}
  $("#loadBtn").addEventListener("click",function(){$("#file").click();});
  $("#file").addEventListener("change",function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){loadText(r.result);};r.readAsText(f);});
  ["dragenter","dragover"].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();document.body.classList.add("drag");});});
  ["dragleave","drop"].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();if(ev==="drop")document.body.classList.remove("drag");});});
  document.addEventListener("drop",function(e){e.preventDefault();document.body.classList.remove("drag");var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(!f)return;var r=new FileReader();r.onload=function(){loadText(r.result);};r.readAsText(f);});

  // ---------- boot ----------
  try{var raw=$("#embedded-data").textContent.trim();var em=raw&&raw!=="null"?JSON.parse(raw):null;if(em&&em.islands)render(em);}catch(e){}
})();
</script>
</body>
</html>
